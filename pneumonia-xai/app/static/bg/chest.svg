<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" fill="none">
<defs>
  <radialGradient id="lung" cx="50%" cy="45%" r="60%">
    <stop offset="0" stop-color="#7fc4ff" stop-opacity=".30"/>
    <stop offset=".6" stop-color="#3b82f6" stop-opacity=".12"/>
    <stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="torso" cx="50%" cy="42%" r="58%">
    <stop offset="0" stop-color="#9fd2ff" stop-opacity=".16"/>
    <stop offset=".75" stop-color="#2563eb" stop-opacity=".05"/>
    <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="heart" cx="45%" cy="45%" r="55%">
    <stop offset="0" stop-color="#e8f4ff" stop-opacity=".34"/>
    <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eaf5ff"/>
    <stop offset="1" stop-color="#8cc2ff"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- soft tissue -->
<path d="M340,20 C330,90 250,120 100,150 C20,170 5,260 15,380
         L40,880 L760,880 L785,380 C795,260 780,170 700,150
         C550,120 470,90 460,20 Z" fill="url(#torso)"/>

<!-- lung fields -->
<g filter="url(#soft)">
  <path d="M360,170 C250,150 145,230 120,420 C105,560 110,700 150,770
           C220,740 310,735 355,760 C360,560 370,320 360,170 Z" fill="url(#lung)"/>
  <path d="M440,170 C550,150 655,230 680,420 C695,560 690,700 650,770
           C580,740 490,735 445,760 C440,560 430,320 440,170 Z" fill="url(#lung)"/>
  <ellipse cx="455" cy="590" rx="125" ry="140" fill="url(#heart)"/>
</g>

<!-- shoulders -->
<g fill="url(#bone)" opacity=".16" filter="url(#soft)">
  <ellipse cx="70" cy="215" rx="46" ry="56"/><ellipse cx="730" cy="215" rx="46" ry="56"/>
</g>
<g stroke="url(#bone)" stroke-linecap="round" opacity=".28" stroke-width="9">
  <path d="M100,235 C130,300 150,380 160,450"/>
  <path d="M700,235 C670,300 650,380 640,450"/>
</g>

