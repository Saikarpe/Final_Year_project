name: CI

# G-11 (stretch): catches the broken-repo problem automatically.
#
# test_gradcam.py, test_splits.py and test_routes.py all run here without the
# (not-committed) dataset or a trained checkpoint: the architecture tests
# build models with weights=None, and the route tests build a throwaway
# untrained checkpoint into tmp_path. Only test_metrics_schema.py still skips,
# since it validates the output of a real scripts/evaluate.py run.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pneumonia-xai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v
